name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package classifies. A classifier is a promise, and
        # a promise no job exercises is the thing this matrix exists to prevent.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv lock --check
      - run: uv sync --locked --all-extras --dev --python "${{ matrix.python }}"

      - name: Install independent PDF metadata consumer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest -q

      - name: build
        run: uv build

  portability:
    name: portability-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked --all-extras --dev
      - name: Atomic publication, paths, links, copies, and interruption recovery
        run: >-
          uv run pytest -q
          tests/test_taxview.py
          tests/test_security.py
          tests/test_cli.py

  synology-contract:
    name: Synology DSM scheduled-job contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked --all-extras --dev
      - name: Reject Bash-only syntax with Ubuntu's POSIX shell
        run: dash -n scripts/synology-task.sh
      - name: Run the DSM scheduler and permissions contract
        run: uv run pytest -q tests/test_synology_task.py

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: Export the shipped Python dependency set
        working-directory: ${{ hashFiles('backend/uv.lock') != '' && 'backend' || '.' }}
        run: >-
          uv export --locked --all-extras --no-dev --no-emit-project
          --format requirements-txt
          --output-file dependency-audit-requirements.txt
      - name: Python dependency audit (pip-audit 2.9.0)
        working-directory: ${{ hashFiles('backend/uv.lock') != '' && 'backend' || '.' }}
        run: |
          uvx --from pip-audit==2.9.0 pip-audit --version
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement dependency-audit-requirements.txt --strict
      - name: Frontend production dependency audit
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm --version
          npm audit --omit=dev --audit-level=high
      - name: Validate reviewed dependency suppressions
        if: hashFiles('dependency-audit-suppressions.json') != ''
        run: python scripts/validate_dependency_suppressions.py --check
      - name: Rust dependency audit (cargo-audit 0.22.2)
        if: hashFiles('frontend/src-tauri/Cargo.lock') != ''
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          audit_args=()
          if [[ -f ../../dependency-audit-suppressions.json ]]; then
            while IFS= read -r advisory; do
              audit_args+=(--ignore "$advisory")
            done < <(python ../../scripts/validate_dependency_suppressions.py --ecosystem rust)
          fi
          cargo audit --version
          cargo audit "${audit_args[@]}"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      - name: Build the distributions
        run: uv build
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          python -m venv /tmp/package-check
          /tmp/package-check/bin/pip install --quiet "$wheel"
          # The console script must exist and answer, from the wheel alone.
          /tmp/package-check/bin/${{ github.event.repository.name }} --version

  scheduled-manifest-scale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: manifest-scale-${{ matrix.entries }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entries: [50000, 100000, 500000]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --all-extras --dev
      - name: Execute production external manifest indexing
        env:
          PAPERLESS_EXPORT_SCALE_ENTRIES: ${{ matrix.entries }}
        run: uv run pytest -q tests/test_manifest_scale.py

name: scale
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 0"

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: manifest-scale-${{ matrix.entries }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entries: [50000, 100000, 500000]
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked --all-extras --dev
      - name: Execute production external manifest indexing
        env:
          PAPERLESS_EXPORT_SCALE_ENTRIES: ${{ matrix.entries }}
        run: uv run pytest -q tests/test_manifest_scale.py

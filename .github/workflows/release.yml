name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Checkout persists the credential used by the later atomic git push.
      # SEMANTIC_RELEASE_TOKEN acts as an owner with the required ruleset bypass.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin release evaluation to the successful CI SHA
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --tags
          git reset --hard "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"

      - name: Plan semantic release without side effects
        id: plan
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          root_options: --noop
          build: false

      - name: Prove the selected version is new
        if: steps.plan.outputs.released == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: >-
          python scripts/release_integrity.py preflight
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"

      - name: Remove stale local distributions
        if: steps.plan.outputs.released == 'true'
        run: |
          mkdir -p dist
          find dist -maxdepth 1 -type f ! -name .gitignore -delete

      - name: Build and stage semantic release locally
        if: steps.plan.outputs.released == 'true'
        id: semrel
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          push: false
          vcs_release: false

      - name: Capture the staged release commit
        if: steps.plan.outputs.released == 'true'
        id: identity
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify source, lock, tag, artifacts, and installed CLI
        if: steps.plan.outputs.released == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_VERSION: ${{ steps.semrel.outputs.version }}
          RELEASE_TAG: ${{ steps.semrel.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: >-
          python scripts/release_integrity.py verify
          --version "$RELEASE_VERSION"
          --expected-version "$EXPECTED_VERSION"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"

      - name: Recheck tested parent and publish release commit atomically
        if: steps.plan.outputs.released == 'true'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_TAG: ${{ steps.semrel.outputs.tag }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"
          test "$(git rev-parse "$RELEASE_COMMIT^")" = "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git push --atomic origin \
            "$RELEASE_COMMIT:refs/heads/main" \
            "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release with verified distributions
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semrel.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.whl dist/*.tar.gz
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes

      - name: Publish verified distributions to PyPI
        if: steps.plan.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Bump Homebrew formula
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          RELEASE_VERSION: ${{ steps.semrel.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          gh workflow run bump.yml -R fileworks/homebrew-tap \
            -f "formula=paperless-export" \
            -f "version=$RELEASE_VERSION" \
            -f "source_repository=$SOURCE_REPOSITORY" \
            -f "source_run=$SOURCE_RUN"

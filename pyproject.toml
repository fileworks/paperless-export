[project]
name = "paperless-export"
version = "1.2.2"
description = "Scheduled wrapper around Paperless-ngx's document_exporter plus a _Steuer/YYYY tax-view post-processor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gykonik" }]
requires-python = ">=3.12"
keywords = ["paperless-ngx", "export", "backup", "documents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
  "typer>=0.15",
]

[project.optional-dependencies]
pdf = ["pikepdf>=9.0"]

[project.urls]
Homepage = "https://github.com/fileworks/paperless-export"
Repository = "https://github.com/fileworks/paperless-export"
Issues = "https://github.com/fileworks/paperless-export/issues"
Changelog = "https://github.com/fileworks/paperless-export/blob/main/CHANGELOG.md"

[project.scripts]
paperless-export = "paperless_export.cli:app"

[dependency-groups]
# Pinned like unpacksort: a lint or type-check that changes under you between
# two runs of the same commit is a gate you cannot trust. Renovate/Dependabot
# raises these deliberately.
dev = [
  "mypy==2.3.0",
  "pikepdf==10.10.0",
  "pytest==9.1.1",
  "respx==0.23.1",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_export"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Same rule set as unpacksort: everything, minus a reviewed ignore list.
select = ["ALL"]
ignore = [
  "C901",
  "COM812",
  "CPY001",
  "D203",
  "D202",
  "D213",
  "FBT001",
  "PERF401",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0917",
  "TC001",
  "TC002",
  "TC003",
  "TRY300",
  "TRY301",
  "UP042",
  # Message style: these two repos write the message at the `raise`, which
  # keeps the error readable where it is produced. Adopting the hoist-to-a-
  # constant form would rewrite every error path in a published tool for no
  # behaviour change; revisit as its own commit.
  "TRY003",
  "EM101",
  "EM102",
  # Docstrings on every public symbol were never this codebase's convention;
  # module and function docstrings carry the explanation instead.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
]

[tool.ruff.lint.per-file-ignores]
# Release scripts fetch a fixed, hard-coded https URL to check version
# uniqueness; the scheme is not caller-controlled.
"scripts/**" = [
  "D103",
  "EM101",
  "EM102",
  "EXE001",
  "PLR2004",
  "S310",
  "S603",
  "S607",
  "T201",
  "TRY003",
]
"src/**" = [
  # Deliberate throughout: internal invariants are asserted, long orchestration
  # functions are single transactions, a few imports are deferred for start-up
  # cost, and SHA-1 is the digest the upstream API publishes.
  "PLC0415",
  "PLR0915",
  "PLR2004",
  "S101",
  "S105",
  "S324",
  "S603",
  "S607",
  "SLF001",
  "FBT002",
  "FBT003",
  "D301",
  # `logging.error` with a message the caller already sanitized; the traceback
  # is logged separately and only under --verbose.
  "TRY400",
  # `**kwargs` forwarded verbatim to httpx.
  "ANN401",
  "RSE102",
  "FURB122",
]
"tests/**" = [
  "ANN",
  "ARG001",
  "ASYNC240",
  "D",
  "DTZ001",
  "FBT002",
  "FBT003",
  "INP001",
  "PLC0415",
  "PLR0402",
  "PLR2004",
  "PT018",
  "S101",
  "S105",
  "S106",
  "S314",
  "S603",
  "SLF001",
  "TC006",
  "S324",
  "PLW0108",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pikepdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/paperless_export/__init__.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
build_command = "python -m ensurepip --upgrade && python -m pip install uv && python scripts/release_integrity.py prepare && uv build"
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
